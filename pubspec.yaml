name: campus_planner
description: A modern Flutter application for managing class schedules, assignments, reminders, notes, and academic calendars.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Local Database
  sqflite: ^2.3.3+1

  # Local Storage
  shared_preferences: ^2.2.3

  # Local Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.0

  # Calendar
  table_calendar: ^3.1.2

  # Date & Time
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.2.1

  # SVG
  flutter_svg: ^2.0.10+1

  # Network Image Cache
  cached_network_image: ^3.4.1

  # UUID
  uuid: ^4.5.1

  # Image Picker
  image_picker: ^1.1.2

  # File Path
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/lottie/

  